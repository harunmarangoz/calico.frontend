name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an older, still-running check pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # @harunmarangoz/calico-design comes from GitHub Packages (.npmrc reads NPM_TOKEN). The
      # package must grant this repository read access (package settings → Manage Actions access).
      - run: npm ci
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm test
      - run: npm run build
